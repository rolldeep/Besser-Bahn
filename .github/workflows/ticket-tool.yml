name: Ticket tool

on:
  pull_request:
    paths:
      - "ticket-tool/**"
      - ".github/workflows/ticket-tool.yml"
  push:
    branches:
      - main
    paths:
      - "ticket-tool/**"
      - ".github/workflows/ticket-tool.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Offline unit tests: the /mob backend is faked, so no network flakiness.
      - name: Install deps
        run: pip install --quiet requests

      - name: Unit tests
        working-directory: ticket-tool
        run: python -m unittest discover -s tests -v

      # The uv quick start: lockfile in sync, package builds, `bbt` entry
      # point and bundled ui.html work from an installed (non-source) copy.
      - name: uv quick start
        working-directory: ticket-tool
        run: |
          pip install --quiet uv
          uv lock --check
          uv run --quiet bbt cron show
          uv tool install --quiet .
          (cd / && "$(uv tool dir --bin)/bbt" serve --port 8799 >/dev/null 2>&1 &) && sleep 3
          curl -sf http://127.0.0.1:8799/ | grep -q "<html"
