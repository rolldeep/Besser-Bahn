# Adds the Besser-Bahn ticket tools (`bbt mcp`) to LibreChat's docker compose.
#
# Copy to your LibreChat checkout as `docker-compose.override.yml` (merge it if
# you already have one), together with librechat.yaml, then set in LibreChat's
# .env:
#   BBT_MCP_TOKEN=<openssl rand -hex 32>
#   BBT_SRC=/path/to/Besser-Bahn/ticket-tool   # default: ../Besser-Bahn/ticket-tool
services:
  api:
    depends_on:
      - bbt-mcp
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml

  bbt-mcp:
    container_name: bbt-mcp
    build: ${BBT_SRC:-../Besser-Bahn/ticket-tool}
    image: bbt-mcp
    restart: always
    # Same user as LibreChat, so watches and config written here stay
    # editable by `bbt` and cron on the host.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - BBT_MCP_TOKEN=${BBT_MCP_TOKEN:?set BBT_MCP_TOKEN in LibreChat's .env}
      - TZ=Europe/Berlin
    volumes:
      # Watches, notification channels and state, shared with the host's `bbt`
      # (create the directory first: mkdir -p ~/.config/besser-bahn-tickets).
      - ${BBT_HOME_DIR:-~/.config/besser-bahn-tickets}:/data
    # No published port: only LibreChat talks to it, on the compose network.
