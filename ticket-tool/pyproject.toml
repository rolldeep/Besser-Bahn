[project]
name = "bbtickets"
version = "0.1.0"
description = "Besser-Bahn ticket tool: search & book DB tickets, watch for last-minute fares"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    # Real Chrome TLS fingerprint: DB's Akamai edge blocks plain requests
    # from many (esp. datacenter) IPs.
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
# `bbt agent`: Claude Agent SDK + Langfuse tracing (pip install 'bbtickets[agent]')
agent = [
    "claude-agent-sdk>=0.2.159",
    "langfuse>=4.17",
    "openinference-instrumentation-claude-agent-sdk>=0.1.20",
]

[project.scripts]
bbt = "bbtickets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bbtickets"]
